# --- Rate limiting (optional; defaults shown). All four are honored at runtime.
# Concurrent requests cap. Lower if you share a tenant w/ other heavy clients.
#rateLimit.maxConcurrent=4
# Steady-state requests/second per process. Resilience4j RateLimiter enforces.
#rateLimit.requestsPerSecond=20
# Max retry attempts per request on 429/timeout (incl. first call).
#rateLimit.maxRetryAttempts=6
# Cap on exponential backoff. Retry-After header may push waits higher.
#rateLimit.maxBackoffSeconds=60
