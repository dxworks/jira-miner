name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  parse-tag:
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.parse.outputs.semver }}
    steps:
      - id: parse
        run: echo "semver=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

  gate:
    needs: [parse-tag]
    uses: dxworks/pipelines/.github/workflows/release-gate.yml@v1
    with:
      java-version: '21'
    permissions:
      contents: read
      security-events: write

  archive:
    needs: [gate, parse-tag]
    uses: dxworks/pipelines/.github/workflows/release-archive.yml@v1
    with:
      version: ${{ needs.parse-tag.outputs.semver }}
      java-version: '21'
    permissions:
      contents: read

  docker:
    needs: [gate, parse-tag]
    uses: dxworks/pipelines/.github/workflows/release-docker.yml@v1
    with:
      version: ${{ needs.parse-tag.outputs.semver }}
      image-name: dxworks/jiraminer
      java-version: '21'
      build-script: ./scripts/build.sh
    secrets:
      dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      contents: read
      packages: write

  github-release:
    needs: [parse-tag, archive, docker]
    if: |
      always() &&
      needs.archive.result == 'success' &&
      (needs.docker.result == 'success' || needs.docker.result == 'skipped')
    uses: dxworks/pipelines/.github/workflows/release-github.yml@v1
    with:
      version: ${{ needs.parse-tag.outputs.semver }}
      tag: ${{ github.ref_name }}
      release-name: JiraMiner ${{ needs.parse-tag.outputs.semver }}
      asset-name: jiraminer.zip
      release-notes-file: releaseNotes/v${{ needs.parse-tag.outputs.semver }}.md
    permissions:
      contents: write
